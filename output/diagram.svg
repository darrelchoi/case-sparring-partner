<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00356b"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3cc"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="18" fill="#ffffff"/>

  <!-- browser -->
  <rect x="24" y="20" width="912" height="62" rx="12" fill="#e8f0fa" stroke="#00356b"/>
  <text x="44" y="46" fill="#00356b" font-size="15" font-weight="700">Browser · candidate</text>
  <text x="44" y="68" fill="#34465e" font-size="12.5">🎤 speech→text (Chrome Web Speech, no tokens) · 🔊 read-aloud · exhibits (Chart.js) · stage tracker · live token meter · scorecard · progress</text>

  <!-- orchestrator -->
  <rect x="250" y="108" width="460" height="74" rx="12" fill="#f3f7fc" stroke="#9fb3cc"/>
  <text x="480" y="132" fill="#14243a" font-size="15" font-weight="700" text-anchor="middle">FastAPI + Orchestrator (Python decides who runs)</text>
  <text x="480" y="152" fill="#5f6f84" font-size="12" text-anchor="middle">input guard → Interviewer → leak filter │ end: Grader → Python checks → Coach</text>
  <text x="480" y="170" fill="#5f6f84" font-size="12" text-anchor="middle">caps: 5 calls &amp; 40K tokens/turn · $0.05/case · $2/day · 40 turns · usage_log.jsonl</text>
  <line x1="480" y1="82" x2="480" y2="106" stroke="#00356b" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- agents -->
  <g>
    <rect x="24" y="226" width="210" height="160" rx="12" fill="#ffffff" stroke="#00356b"/>
    <text x="129" y="252" fill="#00356b" font-size="15" font-weight="700" text-anchor="middle">① Interviewer</text>
    <text x="38" y="276" fill="#14243a" font-size="12.5">runs the live case, every turn</text>
    <text x="38" y="298" fill="#5f6f84" font-size="12">sees: prompt + topic names only</text>
    <text x="38" y="318" fill="#5f6f84" font-size="12">tools: reveal_fact (≤2/turn)</text>
    <text x="38" y="336" fill="#5f6f84" font-size="12">calculator · advance_stage</text>
    <text x="38" y="354" fill="#5f6f84" font-size="12">flag_off_topic</text>
    <text x="38" y="374" fill="#1a7f4b" font-size="11.5">gpt-6-luna · effort low · cached</text>

    <rect x="254" y="226" width="210" height="160" rx="12" fill="#ffffff" stroke="#00356b"/>
    <text x="359" y="252" fill="#00356b" font-size="15" font-weight="700" text-anchor="middle">② Grader</text>
    <text x="268" y="276" fill="#14243a" font-size="12.5">scores the transcript, once</text>
    <text x="268" y="298" fill="#5f6f84" font-size="12">sees: answer key + rubric +</text>
    <text x="268" y="316" fill="#5f6f84" font-size="12">fenced transcript</text>
    <text x="268" y="336" fill="#5f6f84" font-size="12">output: scores + quotes +</text>
    <text x="268" y="354" fill="#5f6f84" font-size="12">math attempts (structured)</text>
    <text x="268" y="374" fill="#1a7f4b" font-size="11.5">Python verifies quotes &amp; math</text>

    <rect x="484" y="226" width="210" height="160" rx="12" fill="#ffffff" stroke="#00356b"/>
    <text x="589" y="252" fill="#00356b" font-size="15" font-weight="700" text-anchor="middle">③ Coach</text>
    <text x="498" y="276" fill="#14243a" font-size="12.5">plans the next practice</text>
    <text x="498" y="298" fill="#5f6f84" font-size="12">sees: scorecard + history</text>
    <text x="498" y="316" fill="#5f6f84" font-size="12">+ library list</text>
    <text x="498" y="336" fill="#5f6f84" font-size="12">output: pattern, focus,</text>
    <text x="498" y="354" fill="#5f6f84" font-size="12">drill, next_case_id</text>
    <text x="498" y="374" fill="#1a7f4b" font-size="11.5">Python checks the case id</text>

    <rect x="714" y="226" width="222" height="160" rx="12" fill="#ffffff" stroke="#00356b"/>
    <text x="825" y="252" fill="#00356b" font-size="15" font-weight="700" text-anchor="middle">④ Case Generator</text>
    <text x="728" y="276" fill="#14243a" font-size="12.5">writes new original cases</text>
    <text x="728" y="298" fill="#5f6f84" font-size="12">output: CaseFile (schema)</text>
    <text x="728" y="318" fill="#5f6f84" font-size="12">→ check_case recomputes</text>
    <text x="728" y="336" fill="#5f6f84" font-size="12">every formula; errors sent</text>
    <text x="728" y="354" fill="#5f6f84" font-size="12">back, max 2 retries</text>
    <text x="728" y="374" fill="#1a7f4b" font-size="11.5">effort medium</text>
  </g>
  <line x1="330" y1="182" x2="129" y2="224" stroke="#00356b" stroke-width="1.7" marker-end="url(#a)"/>
  <line x1="430" y1="182" x2="359" y2="224" stroke="#00356b" stroke-width="1.7" marker-end="url(#a)"/>
  <line x1="530" y1="182" x2="589" y2="224" stroke="#00356b" stroke-width="1.7" marker-end="url(#a)"/>
  <line x1="630" y1="182" x2="825" y2="224" stroke="#00356b" stroke-width="1.7" marker-end="url(#a)"/>
  <text x="244" y="216" fill="#286dc0" font-size="11.5" text-anchor="middle">transcript →</text>
  <text x="474" y="216" fill="#286dc0" font-size="11.5" text-anchor="middle">scorecard →</text>

  <!-- data -->
  <rect x="24" y="420" width="912" height="118" rx="12" fill="#f3f7fc" stroke="#9fb3cc" stroke-dasharray="5 4"/>
  <text x="44" y="446" fill="#14243a" font-size="14" font-weight="700">Data on disk (no database)</text>
  <text x="44" y="470" fill="#5f6f84" font-size="12.5">cases/*.json: 12 original cases (prompt · clarifying answers · hidden facts · exhibits · math answer key) + generated/</text>
  <text x="44" y="490" fill="#5f6f84" font-size="12.5">data/rubric.json · data/prices.json · data/history.json (per user, local, gitignored)</text>
  <text x="44" y="510" fill="#5f6f84" font-size="12.5">output/usage_log.jsonl (every call priced) · safety_log.jsonl · runs/*.json (full transcript + scorecard per case)</text>
  <line x1="129" y1="386" x2="129" y2="418" stroke="#9fb3cc" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="359" y1="386" x2="359" y2="418" stroke="#9fb3cc" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="589" y1="386" x2="589" y2="418" stroke="#9fb3cc" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="825" y1="386" x2="825" y2="418" stroke="#9fb3cc" stroke-width="1.5" marker-end="url(#g)"/>
</svg>
